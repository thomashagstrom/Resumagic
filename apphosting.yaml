# Firebase App Hosting configuration for this app's backend.
#
# Kept small on purpose: the instance cap bounds what a traffic spike, or a
# runaway loop, can cost on a pay-as-you-go plan. Raise it when you need to.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD_7JBmewmweB_b5LejFoD0V7HHvDUFFUQ
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: resumagic-mlin6.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: resumagic-mlin6
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:261917967367:web:841933e6bebdda248556a2
    availability:
      - BUILD
      - RUNTIME
